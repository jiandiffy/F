<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F</title>
<style>
  :root {
    color-scheme: light;
    --fg: #1d1d1f;
    --muted: #9a9aa0;
    --bubble: #f1f1f3;
    --code-bg: #f5f5f7;
    --border: #e5e5e8;
    --quote: #55555a;
    --table-head: #fafafa;
    --code-inline: rgba(0, 0, 0, .05);
    --selection: rgba(0, 0, 0, .12);
  }
  html.theme-dark {
    color-scheme: dark;
    --fg: #ededf0;
    --muted: #9a9aa3;
    --bubble: rgba(255, 255, 255, .10);
    --code-bg: rgba(255, 255, 255, .06);
    --border: rgba(255, 255, 255, .12);
    --quote: #bcbcc4;
    --table-head: rgba(255, 255, 255, .05);
    --code-inline: rgba(255, 255, 255, .08);
    --selection: rgba(255, 255, 255, .20);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font: 14px/1.7 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  #messages {
    /* 左右各让出 F 的悬浮按钮带（--f-corner 由原生注入），高度不透支 */
    max-width: min(780px, calc(100vw - var(--f-corner, 0px) * 2));
    margin: 0 auto;
    padding: 86px 30px 140px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .msg { display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .bubble {
    background: var(--bubble);
    color: var(--fg);
    padding: 7px 13px;
    border-radius: 16px;
    max-width: 82%;
    white-space: pre-wrap;
  }
  .thinking {
    color: #b9b9c0;
    font-size: 12.5px;
    line-height: 1.62;
    white-space: pre-wrap;
    margin: 0 0 8px;
    padding-left: 2px;
    max-height: calc(1.62em * 3);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(0, 0, 0, .12) transparent;
    animation: breathe 1.6s ease-in-out infinite;
  }
  .thinking::-webkit-scrollbar { width: 6px; }
  .thinking::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, .12);
    border-radius: 3px;
  }
  .thinking::-webkit-scrollbar-track { background: transparent; }
  .thinking.done { animation: none; color: #c6c6cb; }
  html.theme-dark .thinking { color: #8f8f98; scrollbar-color: rgba(255, 255, 255, .18) transparent; }
  html.theme-dark .thinking.done { color: #7c7c85; }
  html.theme-dark .thinking::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .18); }
  @keyframes breathe {
    0%, 100% { opacity: .55; }
    50% { opacity: 1; }
  }
  .content > :first-child { margin-top: 0; }
  .content > :last-child { margin-bottom: 0; }
  .content p { margin: 0 0 10px; }
  h1, h2, h3, h4, h5, h6 { line-height: 1.35; margin: 18px 0 8px; font-weight: 600; }
  h1 { font-size: 21px; }
  h2 { font-size: 18px; }
  h3 { font-size: 16px; }
  h4 { font-size: 14.5px; }
  h5, h6 { font-size: 13.5px; color: var(--quote); }
  ul, ol { margin: 0 0 10px; padding-left: 22px; }
  li { margin: 2px 0; }
  li > p { margin: 0; }
  code {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 12.5px;
    background: var(--code-inline);
    padding: 1px 4px;
    border-radius: 4px;
  }
  pre {
    background: var(--code-bg);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 0 0 12px;
  }
  pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; }
  blockquote {
    margin: 0 0 10px;
    padding: 2px 0 2px 12px;
    border-left: 3px solid var(--border);
    color: var(--quote);
  }
  a { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
  table { border-collapse: collapse; margin: 0 0 12px; font-size: 13px; }
  th, td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
  th { background: var(--table-head); }
  img { max-width: 100%; border-radius: 8px; }
  .error { color: #e08b84; font-size: 13px; }
  /* 额度用尽：淡灰色、居中、可换行的提示 */
  .notice {
    align-self: center;
    max-width: 82%;
    text-align: center;
    color: #b9b9c0;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  .notice-detail {
    display: block;
    margin-top: 4px;
    color: #c9c9cf;
    font-size: 12px;
    line-height: 1.6;
  }
  html.theme-dark .notice { color: #7c7c85; }
  html.theme-dark .notice-detail { color: #6e6e77; }
  ::selection { background: var(--selection); }
</style>
</head>
<body>
<div id="messages"></div>
<script src="marked.umd.js"></script>
<script src="conversation.js"></script>
</body>
</html>
